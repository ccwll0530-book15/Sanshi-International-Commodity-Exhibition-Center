
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三氏商城｜商品雲端匯入工具</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f4f0;color:#252238;margin:0;padding:25px}
main{max-width:650px;margin:40px auto;background:white;padding:25px;border-radius:18px}
h1{font-size:25px}
label{display:block;margin-top:15px;font-weight:bold}
input{box-sizing:border-box;width:100%;padding:12px;margin-top:7px;border:1px solid #ddd;border-radius:9px}
button{padding:13px 20px;border:0;border-radius:10px;background:#29233f;color:white;font-weight:bold;margin-top:18px;cursor:pointer;width:100%}
button:disabled{opacity:.5;cursor:not-allowed}
#result{white-space:pre-wrap;background:#f2f0f7;border-radius:10px;padding:15px;margin-top:20px;line-height:1.8;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>三氏國際商城</h1>
<h2>256 項商品雲端匯入工具</h2>
<p>使用管理員帳號登入，將原有商品資料匯入 Supabase。</p>

<label>管理員 Email</label>
<input id="email" type="email" autocomplete="username"
placeholder="請輸入管理員 Email">

<label>管理員密碼</label>
<input id="password" type="password" autocomplete="current-password"
placeholder="請輸入 Supabase Auth 密碼">

<button id="importBtn">登入並開始匯入商品</button>

<div id="result">等待開始……</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="products.js"></script>

<script>
const result = document.getElementById('result');
const button = document.getElementById('importBtn');

function log(message){
  result.textContent += '\n' + message;
}

button.addEventListener('click', async () => {
  button.disabled = true;
  result.textContent = '正在檢查設定……';

  try {
    const config = window.SANSI_SUPABASE_CONFIG || {};
    const source = window.CUSTOM_PRODUCTS || [];

    if (!config.url || !config.publishableKey ||
        config.publishableKey.includes('REPLACE_WITH')) {
      throw new Error('Supabase 設定不完整');
    }

    if (!source.length) {
      throw new Error('找不到 products.js 商品資料');
    }

    const ids = source.map(p => p.id);

    if (ids.some(id => !id) || new Set(ids).size !== ids.length) {
      throw new Error('商品 ID 缺少或重複，請先檢查商品資料');
    }

    log('商品資料筆數：' + source.length);

    const client = window.supabase.createClient(
      config.url,
      config.publishableKey,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );

    log('正在驗證管理員……');

    const {data: login, error: loginError} =
      await client.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });

    if (loginError) throw loginError;

    const {data: isAdmin, error: adminError} =
      await client.rpc('is_sansi_admin');

    if (adminError) throw adminError;
    if (isAdmin !== true) {
      throw new Error('此帳號尚未取得商品管理員權限');
    }

    log('管理員驗證成功');

    log('正在檢查雲端已存在商品……');

    const {data: existing, error: readError} =
      await client.from('products').select('id');

    if (readError) throw readError;

    const existingIds = new Set((existing || []).map(p => p.id));

    const missing = source.filter(p => !existingIds.has(p.id));

    log('雲端已存在：' + existingIds.size + ' 項');
    log('本次待匯入：' + missing.length + ' 項');

    let imported = 0;

    for (let i = 0; i < missing.length; i += 50) {
      const batch = missing.slice(i, i + 50);

      const rows = batch.map(p => ({
        id: p.id,
        data: p,
        updated_at: new Date().toISOString()
      }));

      const {error} = await client
        .from('products')
        .insert(rows);

      if (error) {
        throw new Error(
          '第 ' + (Math.floor(i / 50) + 1) +
          ' 批匯入失敗：' + error.message
        );
      }

      imported += batch.length;
      result.textContent +=
        '\n已匯入 ' + imported + ' / ' + missing.length + ' 項';
    }

    log('-------------------------');
    log('匯入完成！');
    log('原有商品總數：' + source.length);
    log('本次新增：' + imported);
    log('原本已存在而略過：' + (source.length - missing.length));

  } catch (error) {
    log('發生錯誤：' + (error.message || '未知錯誤'));
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
