
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三氏商城｜管理員密碼重設</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 display:grid;place-items:center;
 padding:20px;background:#faf8f3;
 font-family:Arial,"Microsoft JhengHei",sans-serif;
 color:#201f2f
}
main{
 width:min(100%,520px);background:white;
 border-radius:22px;padding:30px;
 box-shadow:0 18px 55px #22194112
}
h1{font-size:25px}
p{font-size:13px;line-height:1.8;color:#777}
label{display:block;font-size:13px;font-weight:bold;margin:17px 0 7px}
input{
 width:100%;padding:13px;border:1px solid #ddd;
 border-radius:10px;font-size:15px
}
button{
 width:100%;padding:14px;margin-top:20px;
 background:#29233f;color:white;border:0;
 border-radius:10px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.notice{
 margin-top:15px;padding:12px;border-radius:10px;
 background:#f1edfa;font-size:12px;line-height:1.7;
 overflow-wrap:anywhere
}
.hidden{display:none}
a{color:#6c58b7}
</style>
</head>
<body>
<main>
<h1 id="title">三氏國際商城</h1>
<p id="intro">管理員密碼重設中心</p>

<form id="requestForm">
<label>管理員 Email</label>
<input id="email" type="email" required
 placeholder="請輸入管理員 Email">
<button id="sendButton">寄送密碼重設信</button>
</form>

<form id="passwordForm" class="hidden">
<label>輸入新密碼</label>
<input id="password" type="password"
 minlength="10" autocomplete="new-password" required>

<label>再次確認新密碼</label>
<input id="confirmPassword" type="password"
 minlength="10" autocomplete="new-password" required>

<button id="updateButton">確認更新密碼</button>
</form>

<div id="message" class="notice hidden"></div>
<p><a href="./">返回三氏國際商城</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
(() => {
 const $ = id => document.getElementById(id);
 const config = window.SANSI_SUPABASE_CONFIG || {};

 const url = String(config.url || "").trim();
 const key = String(config.publishableKey || "").trim();

 const message = $("message");
 const requestForm = $("requestForm");
 const passwordForm = $("passwordForm");

 function show(text){
   message.textContent = text;
   message.classList.remove("hidden");
 }

 if(!window.supabase || !url || !key || key.includes("REPLACE_WITH")){
   show("Supabase 設定錯誤，請檢查 supabase-config.js。");
   $("sendButton").disabled = true;
   return;
 }

 const client = window.supabase.createClient(url,key);
 const redirectTo = location.origin + location.pathname;

 let recoveryVerified = false;

 // 接收 Supabase 密碼重設驗證事件
 client.auth.onAuthStateChange((event,session) => {
   if(event === "PASSWORD_RECOVERY" && session){
     recoveryVerified = true;

     requestForm.classList.add("hidden");
     passwordForm.classList.remove("hidden");

     $("title").textContent = "設定新的管理員密碼";
     $("intro").textContent = "重設連結驗證成功，請設定新密碼。";

     show("驗證成功！請輸入新的管理員密碼。");
   }
 });

 // 顯示失效連結的錯誤
 const params = new URLSearchParams(
   location.hash.replace(/^#/,"")
 );
 const linkError = params.get("error_description");

 if(linkError){
   show("重設連結錯誤：" + linkError);
 }

 // 寄送密碼重設信
 requestForm.addEventListener("submit",async e => {
   e.preventDefault();

   const button = $("sendButton");
   button.disabled = true;
   button.textContent = "正在寄送……";

   try {
     const email = $("email").value.trim();

     const {error} = await client.auth.resetPasswordForEmail(
       email,
       {redirectTo}
     );

     if(error) throw error;

     show(
       "申請已送出。若帳號存在，請查看 Gmail 收件匣及垃圾郵件匣，使用最新的重設信連結。"
     );
   } catch(error){
     show("寄送失敗：" + error.message);
   } finally {
     button.disabled = false;
     button.textContent = "重新寄送密碼重設信";
   }
 });

 // 更新新密碼
 passwordForm.addEventListener("submit",async e => {
   e.preventDefault();

   if(!recoveryVerified){
     show("尚未驗證重設連結，請重新申請密碼重設信。");
     return;
   }

   const password = $("password").value;
   const confirm = $("confirmPassword").value;

   if(password.length < 10){
     show("密碼至少需要 10 個字元。");
     return;
   }

   if(password !== confirm){
     show("兩次密碼輸入不一致。");
     return;
   }

   const button = $("updateButton");
   button.disabled = true;

   try {
     const {error} = await client.auth.updateUser({
       password: password
     });

     if(error) throw error;

     passwordForm.classList.add("hidden");

     $("title").textContent = "密碼更新成功";
     $("intro").textContent = "你現在可以使用新密碼登入管理員帳號。";

     show("密碼更新成功！請妥善保存新密碼。");
   } catch(error){
     show("更新失敗：" + error.message);
   } finally {
     button.disabled = false;
   }
 });
})();
</script>
</body>
</html>
